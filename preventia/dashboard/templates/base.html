<!doctype html>
<html lang="es-CL" class="contrast-{{ view.contrast }} letra-{{ view.font }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PreventIA{% endblock %}</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<a class="salto" href="#contenido">{{ T.skip_to_queue }}</a>

<header class="barra">
  <p class="marca">PreventIA<span class="marca__sub">seguimiento entre controles</span></p>

  <div class="preferencias">
    <form method="post" action="/preferencias/contraste" class="preferencia">
      <fieldset>
        <legend>{{ T.contrast_toggle }}</legend>
        <button type="submit" name="contrast" value="standard"
                {% if view.contrast == 'standard' %}aria-pressed="true" class="activo"{% else %}aria-pressed="false"{% endif %}>Normal</button>
        <button type="submit" name="contrast" value="high"
                {% if view.contrast == 'high' %}aria-pressed="true" class="activo"{% else %}aria-pressed="false"{% endif %}>Alto</button>
      </fieldset>
    </form>

    <form method="post" action="/preferencias/letra" class="preferencia">
      <fieldset>
        <legend>{{ T.font_size_toggle }}</legend>
        {% for etiqueta in T.font_size_steps %}
        <button type="submit" name="font" value="{{ loop.index0 }}"
                {% if view.font == loop.index0|string %}aria-pressed="true" class="activo"{% else %}aria-pressed="false"{% endif %}>{{ etiqueta }}</button>
        {% endfor %}
      </fieldset>
    </form>

    {% if roster %}
    <form method="post" action="/preferencias/responsable" class="preferencia preferencia--responsable">
      <label for="responsable">{{ T.acting_as }}</label>
      <select id="responsable" name="actor_code">
        {% for persona in roster %}
        <option value="{{ persona.code }}" {% if actor and persona.code == actor.code %}selected{% endif %}>{{ persona.display_name }}</option>
        {% endfor %}
      </select>
      <button type="submit">Cambiar</button>
    </form>
    {% endif %}
  </div>
</header>

<main id="contenido">
{% block content %}{% endblock %}
</main>

<footer class="pie">
  <p>{{ T.not_a_diagnosis }}</p>
</footer>
</body>
</html>
